<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compression Compare</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 1.5rem; }
        h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 1rem; color: #fff; }
        .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
        .controls button { padding: 0.4rem 0.9rem; cursor: pointer; background: #2d2d4a; color: #e0e0e0; border: 1px solid #444; border-radius: 3px; font-size: 0.85rem; }
        .controls button:hover { background: #3d3d5a; }
        .controls button:disabled { opacity: 0.5; cursor: default; }
        .controls label { font-size: 0.85rem; }
        .controls input[type=number] { width: 40px; background: #2d2d4a; color: #e0e0e0; border: 1px solid #444; border-radius: 3px; padding: 0.3rem; text-align: center; }
        .controls select { background: #2d2d4a; color: #e0e0e0; border: 1px solid #444; border-radius: 3px; padding: 0.3rem; }
        #fileInfo { font-size: 0.85rem; color: #aaa; }
        #progress { font-size: 0.85rem; color: #7eb8da; margin-bottom: 0.5rem; min-height: 1.2em; }
        table { border-collapse: collapse; font-size: 0.85rem; width: auto; }
        thead th { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid #444; color: #aaa; font-weight: 500; cursor: pointer; user-select: none; white-space: nowrap; }
        thead th:hover { color: #fff; }
        thead th.sorted-asc::after { content: ' \25B2'; font-size: 0.7em; }
        thead th.sorted-desc::after { content: ' \25BC'; font-size: 0.7em; }
        tbody tr { border-bottom: 1px solid #2a2a40; transition: background 0.15s; }
        tbody tr:hover { background: #252545; }
        tbody tr.selected { background: #1a3a5c; }
        tbody tr.baseline { color: #888; }
        tbody tr.error td { color: #e06060; }
        tbody tr.running td.status-cell { color: #7eb8da; }
        td { padding: 0.5rem 0.7rem; white-space: nowrap; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        td.best { color: #4ade80; font-weight: 600; }
        .verified { color: #4ade80; font-size: 0.75rem; margin-left: 0.3rem; }
        .verify-fail { color: #e06060; font-size: 0.75rem; margin-left: 0.3rem; }
        .depacker-input { width: 45px; background: #2d2d4a; color: #e0e0e0; border: 1px solid #333; border-radius: 2px; padding: 0.15rem 0.3rem; text-align: right; font-size: 0.8rem; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
        .depacker-input::-webkit-inner-spin-button, .depacker-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .asm-btn { background: #2d2d4a; color: #7eb8da; border: 1px solid #444; border-radius: 2px; padding: 0.1rem 0.4rem; cursor: pointer; font-size: 0.75rem; font-family: inherit; }
        .asm-btn:hover { background: #3d3d5a; color: #fff; }
        td.chk { text-align: center; padding: 0.3rem 0.4rem; }
        td.chk input { cursor: pointer; }
        th.chk-all { text-align: center; padding: 0.3rem 0.4rem; cursor: pointer; }
        .note { font-size: 0.75rem; color: #777; margin-top: 0.8rem; }
    </style>
</head>
<body>
    <h1>Compression Compare</h1>
    <div class="controls">
        <button id="selectBtn" onclick="document.getElementById('fileInput').click()">Select File</button>
        <input type="file" id="fileInput" style="display:none">
        <span id="fileInfo"></span>
        <label>Level: <input type="number" id="level" value="5" min="1" max="9"></label>
        <button id="goBtn" onclick="runAll()" disabled>Go</button>
    </div>
    <div id="progress"></div>
    <table>
        <thead>
            <tr>
                <th class="chk-all"><input type="checkbox" id="checkAll" checked title="Select all" onchange="toggleAll(this.checked)"></th>
                <th data-col="method">Method</th>
                <th data-col="size">Size</th>
                <th data-col="saved">Saved</th>
                <th data-col="ratio">Ratio</th>
                <th data-col="depacker">Depacker</th>
                <th data-col="total">Total</th>
                <th>ASM</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
    <p class="note">Depacker sizes are editable (Z80 standard depackers). Saved = Size - Original. Total = Saved + Depacker.</p>

    <script src="zx7-js/zx7-js.js"></script>
    <script src="zx0-js/zx0-js.js"></script>
    <script src="lc-js/lc-js.js"></script>
    <script src="exomizer2-js/exomizer2-js.js"></script>
    <script src="upkr-js/upkr-js.js"></script>
    <script src="lgk-js/lgk-js.js"></script>
    <script src="shrinkler-js/shrinkler-js.js"></script>
    <script src="aplib-js/aplib-js.js"></script>
    <script src="lzsa2-js/lzsa2-js.js"></script>
    <script src="hrust-js/hrust-js.js"></script>
    <script src="rip-js/rip-js.js"></script>
    <script src="bitbuster-js/bitbuster-js.js"></script>
    <script src="rcs-js/rcs-js.js"></script>
    <script src="asc-js/asc-js.js"></script>
    <script>
    'use strict';

    // ---- Compressor definitions ----
    // depacker: typical Z80 depacker size in bytes (editable in UI)
    const compressors = [
        { id: 'plain',    name: 'Plain (original)', depacker: 0, isBaseline: true },
        { id: 'rcszx0', name: 'RCS + ZX0', depacker: 112,
          screenOnly: true,
          compress: d => RCS.compressZX0(d),
          decompress: d => RCS.decompressZX0(d) },
        { id: 'rcszx0b', name: 'RCS + ZX0 backwards', depacker: 113,
          screenOnly: true,
          compress: d => RCS.compressZX0(d, true),
          decompress: d => RCS.decompressZX0(d, true) },
        { id: 'rcszx7', name: 'RCS + ZX7', depacker: 110,
          screenOnly: true,
          compress: d => RCS.compressZX7(d),
          decompress: d => RCS.decompressZX7(d) },
        { id: 'rcszx7b', name: 'RCS + ZX7 backwards', depacker: 110,
          screenOnly: true,
          compress: d => RCS.compressZX7(d, true),
          decompress: d => RCS.decompressZX7(d, true) },
        { id: 'zx7',      name: 'ZX7',              depacker: 69,
          compress: d => ZX7.compress(d).data,
          decompress: d => ZX7.decompress(d) },
        { id: 'zx7b',     name: 'ZX7 backwards',    depacker: 69,
          compress: d => ZX7.compressBackwards(d).data,
          decompress: d => ZX7.decompressBackwards(d) },
        { id: 'zx0',      name: 'ZX0',              depacker: 68,
          compress: d => ZX0.compress(d, 0).data,
          decompress: d => ZX0.decompress(d) },
        { id: 'zx0b',     name: 'ZX0 backwards',    depacker: 69,
          compress: d => ZX0.compress(d, 0, true).data,
          decompress: d => ZX0.decompress(d, true) },
        { id: 'lc',       name: 'LC',               depacker: 209,
          compress: d => LC.compress(d).data,
          decompress: d => LC.decompress(d) },
        { id: 'exo',      name: 'Exomizer 2',       depacker: 169,
          compress: (d, lv) => Exomizer2.compress(d, lv === 9 ? 65536 : lv * 100).data,
          decompress: d => Exomizer2.decompress(d) },
        { id: 'exob',     name: 'Exomizer 2 backwards', depacker: 169,
          compress: (d, lv) => Exomizer2.compressBackwards(d, lv === 9 ? 65536 : lv * 100).data,
          decompress: d => Exomizer2.decompressBackwards(d) },
        { id: 'upkrz80',  name: 'UPKR (Z80)',       depacker: 82,
          compress: (d, lv) => UPKR.compress(d, lv, UPKR.configZ80()),
          decompress: d => UPKR.decompress(d, UPKR.configZ80()) },
        { id: 'shrinkler', name: 'Shrinkler',       depacker: 250,
          compress: (d, lv) => Shrinkler.compress(d, lv, { parityContext: true }),
          decompress: d => Shrinkler.decompress(d, { parityContext: true }) },
        { id: 'aplib',    name: 'aPLib',             depacker: 92,
          compress: (d, lv) => aPLib.compress(d, lv),
          decompress: d => aPLib.decompress(d) },
        { id: 'lzsa2',    name: 'LZSA2',            depacker: 69,
          compress: (d, lv) => LZSA2.compress(d, lv),
          decompress: d => LZSA2.decompress(d) },
        { id: 'hrust',    name: 'Hrust',            depacker: 232,
          compress: (d, lv) => HRUST.compress(d, lv),
          decompress: d => HRUST.decompress(d) },
        { id: 'rip',      name: 'RIP',              depacker: 228,
          compress: (d, lv) => RIP.compress(d, lv),
          decompress: d => RIP.decompress(d) },
        { id: 'mrip',     name: 'mRIP',             depacker: 218,
          compress: (d, lv) => RIP.compressMrip(d, lv),
          decompress: d => RIP.decompressMrip(d) },
        { id: 'bb12',     name: 'BitBuster 1.2',    depacker: 124,
          compress: (d, lv) => BitBuster.compress(d, lv),
          decompress: d => BitBuster.decompress(d) },
        { id: 'bb2',      name: 'BitBuster 2',      depacker: 104,
          compress: (d, lv) => BitBuster.compress2(d, lv),
          decompress: d => BitBuster.decompress2(d) },
    ];

    // Screen-only compressors (6912 bytes), added conditionally
    const screenOnlyEntries = [
        { id: 'lcscr', name: 'LC screen', depacker: 209,
          screenOnly: true,
          compress: d => LC.compressScreen(d).data,
          decompress: d => LC.decompressScreen(d) },
        { id: 'lgk', name: 'LgK', depacker: 612,
          screenOnly: true,
          compress: d => LgK.compress(d),
          decompress: d => LgK.decompress(d) },
        { id: 'lgkopt', name: 'LgK (opt)', depacker: 612,
          screenOnly: true, attrsModified: true,
          compress: d => LgK.compress(d, { optimizeAttrs: true }),
          decompress: d => LgK.decompress(d) },
        { id: 'asc', name: 'ASC', depacker: 194,
          screenOnly: true,
          compress: d => ASC.compressTokens(d),
          decompress: d => ASC.decompressTokens(d) },
    ];

    let inputData = null;
    let results = [];
    let sortCol = null;
    let sortAsc = true;

    // ---- Checkbox state (localStorage) ----
    const STORAGE_KEY = 'compressors_enabled';
    let enabledMap = {};

    function loadEnabled() {
        try {
            const s = localStorage.getItem(STORAGE_KEY);
            if (s) enabledMap = JSON.parse(s);
        } catch (e) {}
    }

    function saveEnabled() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(enabledMap)); } catch (e) {}
    }

    function isEnabled(id) {
        return enabledMap[id] !== false; // default true
    }

    function toggleEnabled(id, checked) {
        enabledMap[id] = checked;
        saveEnabled();
        updateCheckAll();
    }

    function toggleAll(checked) {
        for (const c of getActiveCompressors()) {
            if (c.isBaseline) continue;
            enabledMap[c.id] = checked;
        }
        saveEnabled();
        renderTable();
    }

    function updateCheckAll() {
        const active = getActiveCompressors().filter(c => !c.isBaseline);
        const allChecked = active.every(c => isEnabled(c.id));
        document.getElementById('checkAll').checked = allChecked;
    }

    loadEnabled();

    // ---- File selection ----
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const goBtn = document.getElementById('goBtn');

    fileInput.addEventListener('change', async function() {
        if (!this.files.length) return;
        const file = this.files[0];
        inputData = new Uint8Array(await file.arrayBuffer());
        fileInfo.textContent = file.name + ' (' + inputData.length + ' bytes)';
        goBtn.disabled = false;
        results = [];
        renderTable();
    });

    // ---- Build active compressor list ----
    function getActiveCompressors() {
        const list = compressors.slice();
        list.push(...screenOnlyEntries);
        return list;
    }

    // ---- Run all compressors ----
    async function runAll() {
        if (!inputData) return;
        goBtn.disabled = true;
        const level = parseInt(document.getElementById('level').value) || 5;
        const active = getActiveCompressors();
        const origSize = inputData.length;
        results = [];

        // Baseline
        results.push({ id: 'plain', size: origSize, saved: 0, ratio: 100, depacker: 0, total: 0, verified: true, isBaseline: true });

        renderTable();

        for (let i = 0; i < active.length; i++) {
            const c = active[i];
            if (c.isBaseline) continue;
            if (!isEnabled(c.id)) continue;
            if (c.screenOnly && origSize !== 6912) continue;

            document.getElementById('progress').textContent = 'Compressing: ' + c.name + ' (' + (i) + '/' + (active.length - 1) + ')...';
            renderTable();

            await sleep(5);

            try {
                const compressed = c.compress(inputData, level);
                const compSize = compressed.length || compressed.byteLength;

                // Verify roundtrip
                let verified = false;
                let verifyError = '';
                try {
                    const decompressed = c.decompress(compressed);
                    if (decompressed.length === origSize) {
                        if (c.attrsModified) {
                            // optimizeAttrs changes both pixels and attrs; just verify decompression succeeds
                            verified = true;
                            verifyError = 'attrs optimized';
                        } else {
                            verified = true;
                            for (let j = 0; j < origSize; j++) {
                                if (decompressed[j] !== inputData[j]) {
                                    verified = false;
                                    verifyError = 'mismatch at byte ' + j;
                                    break;
                                }
                            }
                        }
                    } else {
                        verifyError = 'length ' + decompressed.length + ' vs ' + origSize;
                    }
                } catch (e) {
                    verifyError = 'decompress: ' + e.message;
                }

                const dp = getDepackerSize(c.id);
                const saved = compSize - origSize;
                results.push({
                    id: c.id,
                    size: compSize,
                    saved: saved,
                    ratio: (compSize / origSize * 100),
                    depacker: dp,
                    total: saved + dp,
                    verified: verified,
                    verifyError: verifyError,
                    compressedData: new Uint8Array(compressed)
                });
            } catch (e) {
                results.push({
                    id: c.id,
                    size: null,
                    saved: null,
                    ratio: null,
                    depacker: getDepackerSize(c.id),
                    total: null,
                    verified: false,
                    verifyError: e.message,
                    error: true
                });
            }

            renderTable();
        }

        document.getElementById('progress').textContent = 'Done.';
        goBtn.disabled = false;
    }

    function getDepackerSize(id) {
        const el = document.querySelector('.depacker-input[data-id="' + id + '"]');
        if (el) return parseInt(el.value) || 0;
        const c = getActiveCompressors().find(x => x.id === id);
        return c ? c.depacker : 0;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // ---- Render table ----
    function renderTable() {
        const tbody = document.getElementById('tbody');
        const active = getActiveCompressors();
        const rows = [];

        for (const c of active) {
            const r = results.find(x => x.id === c.id);
            rows.push({ def: c, result: r || null });
        }

        // Sort
        if (sortCol) {
            rows.sort((a, b) => {
                if (a.def.isBaseline) return -1;
                if (b.def.isBaseline) return 1;
                const av = getSortValue(a, sortCol);
                const bv = getSortValue(b, sortCol);
                if (av === null && bv === null) return 0;
                if (av === null) return 1;
                if (bv === null) return -1;
                return sortAsc ? (av < bv ? -1 : av > bv ? 1 : 0) : (av > bv ? -1 : av < bv ? 1 : 0);
            });
        }

        // Find bests
        let bestSize = Infinity, bestSaved = Infinity, bestRatio = Infinity, bestTotal = Infinity;
        for (const row of rows) {
            if (!row.result || row.result.isBaseline || row.result.error) continue;
            if (row.result.size < bestSize) bestSize = row.result.size;
            if (row.result.saved < bestSaved) bestSaved = row.result.saved;
            if (row.result.ratio < bestRatio) bestRatio = row.result.ratio;
            if (row.result.total < bestTotal) bestTotal = row.result.total;
        }

        let html = '';
        for (const row of rows) {
            const c = row.def;
            const r = row.result;
            const cls = [];
            if (c.isBaseline) cls.push('baseline');
            if (r && r.error) cls.push('error');
            if (!r && !c.isBaseline) cls.push('running');

            html += '<tr class="' + cls.join(' ') + '">';

            // Checkbox
            if (c.isBaseline) {
                html += '<td class="chk"></td>';
            } else {
                html += '<td class="chk"><input type="checkbox"' + (isEnabled(c.id) ? ' checked' : '') + ' onchange="toggleEnabled(\'' + c.id + '\',this.checked)"></td>';
            }

            // Method
            html += '<td>' + esc(c.name);
            if (r && r.verified && r.verifyError) html += '<span class="verified" title="' + esc(r.verifyError) + '">&#10003;*</span>';
            else if (r && r.verified) html += '<span class="verified" title="Roundtrip verified">&#10003;</span>';
            else if (r && !r.verified && r.verifyError) html += '<span class="verify-fail" title="' + esc(r.verifyError) + '">&#10007;</span>';
            html += '</td>';

            if (c.isBaseline && r) {
                html += '<td class="num">' + r.size + '</td>';
                html += '<td class="num">0</td>';
                html += '<td class="num">100.0%</td>';
                html += '<td class="num">0</td>';
                html += '<td class="num">0</td>';
                html += '<td></td>';
            } else if (r && !r.error) {
                html += '<td class="num' + (r.size === bestSize ? ' best' : '') + '">' + r.size + '</td>';
                html += '<td class="num' + (r.saved === bestSaved ? ' best' : '') + '">' + r.saved + '</td>';
                html += '<td class="num' + (r.ratio === bestRatio ? ' best' : '') + '">' + r.ratio.toFixed(1) + '%</td>';
                html += '<td class="num"><input class="depacker-input" data-id="' + c.id + '" type="number" value="' + r.depacker + '" min="0" onchange="updateDepacker(this)"></td>';
                html += '<td class="num' + (r.total === bestTotal ? ' best' : '') + '">' + r.total + '</td>';
                html += '<td>' + (asmInfo[c.id] ? '<button class="asm-btn" onclick="downloadAsm(\'' + c.id + '\')">ASM</button>' : '') + '</td>';
            } else if (r && r.error) {
                html += '<td class="num" colspan="3">' + esc(r.verifyError) + '</td>';
                html += '<td class="num"><input class="depacker-input" data-id="' + c.id + '" type="number" value="' + c.depacker + '" min="0"></td>';
                html += '<td class="num">-</td>';
                html += '<td></td>';
            } else {
                // Not yet run
                html += '<td class="num status-cell">-</td>';
                html += '<td class="num status-cell">-</td>';
                html += '<td class="num status-cell">-</td>';
                html += '<td class="num"><input class="depacker-input" data-id="' + c.id + '" type="number" value="' + c.depacker + '" min="0" onchange="updateDepacker(this)"></td>';
                html += '<td class="num status-cell">-</td>';
                html += '<td></td>';
            }

            html += '</tr>';
        }
        tbody.innerHTML = html;
        updateCheckAll();
    }

    function getSortValue(row, col) {
        if (col === 'method') return row.def.name.toLowerCase();
        if (col === 'depacker') return row.result ? row.result.depacker : row.def.depacker;
        const r = row.result;
        if (!r || r.error) return null;
        switch (col) {
            case 'size': return r.size;
            case 'saved': return r.saved;
            case 'ratio': return r.ratio;
            case 'total': return r.total;
        }
        return null;
    }

    function updateDepacker(el) {
        const id = el.dataset.id;
        const r = results.find(x => x.id === id);
        if (r && !r.error && !r.isBaseline) {
            r.depacker = parseInt(el.value) || 0;
            r.total = r.saved + r.depacker;
            renderTable();
        }
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // ---- ASM depacker definitions ----
    // Z80 depacker sources from https://github.com/uniabis/z80depacker
    // ZX0 backward from https://github.com/einar-saukas/ZX0

    const asmInfo = {
        zx7: {
            setup: '    ld hl,packed_data\n    ld de,$4000\n    call depacker\nloop:\n    ld a,r\n    and 7\n    out ($fe),a\n    jr loop\n',
            depacker:
'; ZX7 decoder by Einar Saukas, Antonio Villena & Metalbrain\n\
; "Standard" version (69 bytes only)\n\
; HL: source address, DE: destination address\n\
depacker:\n\
        ld      a, $80\n\
.copy_byte_loop:\n\
        ldi\n\
.main_loop:\n\
        call    .next_bit\n\
        jr      nc, .copy_byte_loop\n\
        push    de\n\
        ld      bc, 0\n\
        ld      d, b\n\
.len_size_loop:\n\
        inc     d\n\
        call    .next_bit\n\
        jr      nc, .len_size_loop\n\
.len_value_loop:\n\
        call    nc, .next_bit\n\
        rl      c\n\
        rl      b\n\
        jr      c, .exit\n\
        dec     d\n\
        jr      nz, .len_value_loop\n\
        inc     bc\n\
        ld      e, (hl)\n\
        inc     hl\n\
        defb    $cb, $33 ; SLL E\n\
        jr      nc, .offset_end\n\
        ld      d, $10\n\
.rld_next_bit:\n\
        call    .next_bit\n\
        rl      d\n\
        jr      nc, .rld_next_bit\n\
        inc     d\n\
        srl     d\n\
.offset_end:\n\
        rr      e\n\
        ex      (sp), hl\n\
        push    hl\n\
        sbc     hl, de\n\
        pop     de\n\
        ldir\n\
.exit:\n\
        pop     hl\n\
        jr      nc, .main_loop\n\
.next_bit:\n\
        add     a, a\n\
        ret     nz\n\
        ld      a, (hl)\n\
        inc     hl\n\
        rla\n\
        ret\n'
        },
        zx7b: {
            setup: '    ld hl,packed_data_end-1\n    ld de,$5AFF\n    call depacker\nloop:\n    ld a,r\n    and 7\n    out ($fe),a\n    jr loop\n',
            depacker:
'; ZX7 decoder by Einar Saukas, Antonio Villena & Metalbrain\n\
; "Standard" version (69 bytes only) - BACKWARDS VARIANT\n\
; HL: last source address, DE: last destination address\n\
depacker:\n\
        ld      a, $80\n\
.copy_byte_loop:\n\
        ldd\n\
.main_loop:\n\
        call    .next_bit\n\
        jr      nc, .copy_byte_loop\n\
\n\
        push    de\n\
        ld      bc, 0\n\
        ld      d, b\n\
.len_size_loop:\n\
        inc     d\n\
        call    .next_bit\n\

    // ---- LgK dynamic ASM generator ----

    function parseLgkHeader(data) {
        let pos = 0;
        function readBit() { const byteIdx = pos >> 3; const bitIdx = 7 - (pos & 7); pos++; return (data[byteIdx] >> bitIdx) & 1; }
        function readBits(n) { let v = 0; for (let i = 0; i < n; i++) v = v * 2 + readBit(); return v; }

        const cfg = new Array(17).fill(0);
        cfg[16] = 1 - readBit();           // CFASEP
        const monoFlag = readBit();         // mono flag
        if (monoFlag) cfg[11] = 1; else cfg[11] = 256; // CFDIFA
        cfg[0] = readBits(2);              // CFGRP
        cfg[13] = readBits(2);             // CFAREM
        const alzero = readBit();
        cfg[12] = readBit();               // CFFLASH
        let prevPred = 0;
        if (cfg[11] === 1) {
            prevPred = readBits(8); cfg[14] = 0; // CFAREB=0
        } else {
            cfg[14] = readBits(8) - 1;     // CFAREB
        }
        cfg[15] = readBits(8) - 1;         // CFARLEB
        if (cfg[15] === 0) cfg[15] = 1;
        cfg[4] = readBits(8);              // CFVB1
        cfg[6] = readBits(8);              // CFVB2
        cfg[7] = readBits(7) & 1;          // CFHB2
        cfg[5] = readBit();                // CFHB1
        cfg[1] = readBits(7);              // CFREB
        cfg[2] = readBit();                // CFRPR
        cfg[3] = 0;                        // CFINV always 0 in JS

        const treeSize = readBits(8);
        const modeTree = new Array(14).fill(0);
        for (let i = 0; i < treeSize; i++) {
            const x = readBits(8);
            if (x <= 7) modeTree[i] = x;
            else modeTree[i] = x;          // branch values >=0xE1
        }

        const palCount = readBits(8) - (alzero ? 1 : 0);
        if (!alzero) cfg[11] = palCount;    // CFDIFA
        const attrPalette = [];
        for (let i = 0; i < palCount; i++) attrPalette.push(readBits(8));

        const mono = (cfg[11] === 1);
        const headerBytes = (pos + 7) >> 3;
        return { cfg, mono, prevPred, modeTree, attrPalette, palCount, headerBytes };
    }

    function lgkDepcalc(cfg) {
        // Label indices
        const L = { _xorri:0, _xorre:1, _xtinv:2, _xorh2:3, _xorv2:4, _xorh1:5, _xorv1:6,
            _noxor:7, _xmtree:8, _cellcode:9, _twalk:10, _getbit:11, _fillbits:12, _ldrpr:13,
            _xvini:14, _tiledepack:15, _twindepack:16, _attrle:17, _attree:18, _cctree:19,
            _adepack:20, _trun:21, _adreps:22, _adsaverle:23, _adrepl:24, _getbits:25,
            _adnorh:26, _altabl:27, _adnorv:28, _adrepv:29, _adskil:30, _adresl:31,
            _adskir:32, _adresr:33, _altab:34 };
        const zxofs = new Array(35).fill(-1);

        // Fragment sizes (first byte of each C array)
        const SZ_start = 7;
        const SZ_depack_asep = 40, SZ_depack_amix = 42, SZ_depack_bics = 33, SZ_depack_bicm = 34;
        const SZ_cctwalk = 22, SZ_getbit = 11;
        const SZ_xorr8reb = 14, SZ_xorr8rpr = 24, SZ_xorrLreb = 24, SZ_xorrLrpr = 38;
        const SZ_xorv = 50, SZ_xorvLref = 53, SZ_xorh = 44;
        const SZ_tileclear = 8, SZ_quafdepack = 35, SZ_sixtdepack = 30;
        const SZ_adepack = 3, SZ_adeprle = 8;
        const SZ_trun = 10, SZ_truna5 = 11, SZ_trunLref = 12;
        const SZ_adrepsrle = 9, SZ_adreps5 = 6, SZ_adreps3 = 3;
        const SZ_adnorh3 = 8, SZ_adnorv3 = 10, SZ_adnorh5 = 15, SZ_adnorv5 = 18;
        const SZ_almode0 = 17, SZ_almode1v = 13, SZ_almode1x = 14;
        const SZ_getbits = 10;
        const QUARS = 1;

        // start fragment
        if (cfg[16]) sz += SZ_start + 1; // +1 for the extra byte in appendep (zxbin[0]+1 = 7+1=8?)
        else sz += SZ_start + 1;

        // Then "if !undins" adds 2 bytes (ld c,$80)
        // Let me recalculate properly:
        // start: 7 bytes
        sz = 7;
        // depack variant
        if (cfg[16]) { // CFASEP
            if (cfg[11] > 1) sz += SZ_depack_asep; // CFDIFA
            else sz += SZ_depack_bics;
        } else {

        sz += 2;

        zxofs[L._xmtree] = sz;
        sz += 14;

        zxofs[L._cellcode] = sz;
        zxofs[L._twalk] = sz + 3;
        sz += SZ_cctwalk;

        zxofs[L._getbit] = sz;
        zxofs[L._fillbits] = sz + 3;
        sz += SZ_getbit;

        zxofs[L._xorri] = sz;
        zxofs[L._xorre] = sz + 1;
        if (cfg[1] < 9) { // CFREB
            if (cfg[2]) { // CFRPR
                zxofs[L._ldrpr] = sz + 7;
                sz += SZ_xorr8rpr;
            } else sz += SZ_xorr8reb;
        } else {
            if (cfg[2]) {
                zxofs[L._ldrpr] = sz + 28;
                sz += SZ_xorrLrpr;
            } else sz += SZ_xorrLreb;
        }

        zxofs[L._xorv2] = sz;
        zxofs[L._xtinv] = sz + 1;
        zxofs[L._xorv1] = sz + 4;
        zxofs[L._xvini] = sz + 13;
        if (cfg[1] < 9) sz += SZ_xorv;
        else sz += SZ_xorvLref;
        zxofs[L._noxor] = sz - 1;

        zxofs[L._xorh1] = sz;
        zxofs[L._xorh2] = sz + 1;
        sz += SZ_xorh;

        zxofs[L._tiledepack] = sz;
        if (cfg[0] > QUARS) sz += SZ_tileclear; // CFGRP
        if (QUARS & cfg[0]) sz += SZ_quafdepack;
        else sz += SZ_sixtdepack;

        if (cfg[11] > 1) { // CFDIFA
            if (cfg[15] > 1) { zxofs[L._attrle] = sz; sz++; } // CFARLEB
            zxofs[L._attree] = sz;
            if (cfg[13] > 1) sz += 8; // CFAREM
            else sz += 4;
        }

        zxofs[L._cctree] = sz;
        sz += 30;

        if (cfg[11] > 1) {
            zxofs[L._adepack] = sz;
            if (cfg[15] > 1) sz += SZ_adeprle; // CFARLEB
            else sz += SZ_adepack;
        }

        zxofs[L._trun] = sz;
        if (cfg[1] > 8) sz += SZ_trunLref;
        else if ((cfg[11] > 1) && (cfg[13] > 1)) sz += SZ_truna5;
        else sz += SZ_trun;

        if (cfg[11] > 1) { // CFDIFA
            if (cfg[13] > 1) { // CFAREM
                zxofs[L._adreps] = sz;
                if (cfg[15] > 1) { // CFARLEB
                    zxofs[L._adsaverle] = sz + 6;
                    sz += SZ_adrepsrle + 1; // +1 for "xor a"
                }
                sz += SZ_adreps5;
            }

            zxofs[L._adrepl] = sz;
            if (cfg[14] > 0) { // CFAREB
                if (1 & cfg[13]) { // CFAREM
                    if (cfg[11] <= (1 << cfg[14])) sz += SZ_almode1v;
                    else sz += SZ_almode1x;
                } else sz += SZ_almode0;
            } else sz += 2; // "ld b,N"
        }

        zxofs[L._getbits] = sz;
        sz += SZ_getbits;

        if (cfg[11] > 1) { // CFDIFA
            if (cfg[13] > 1) { // CFAREM
                zxofs[L._adnorh] = sz;
                zxofs[L._adskil] = sz + 2;
                zxofs[L._adresl] = sz + 7;
                sz += SZ_adnorh5;
                zxofs[L._adnorv] = sz;
                zxofs[L._adskir] = sz + 2;
                zxofs[L._adresr] = sz + 7;
                zxofs[L._altabl] = sz + 11;
                sz += SZ_adnorv5;
            } else {
                zxofs[L._adreps] = sz;
                if (cfg[15] > 1) { // CFARLEB
                    zxofs[L._adsaverle] = sz + 6;
                    sz += SZ_adrepsrle;
                }
                sz += SZ_adreps3;
                zxofs[L._adnorh] = sz;
                sz += SZ_adnorh3;
                zxofs[L._adnorv] = sz;
                zxofs[L._adrepv] = sz + 3;
                zxofs[L._altabl] = sz + 7;
                sz += SZ_adnorv3;
            }
            zxofs[L._altab] = sz;
        }

        return { zxofs, depSize: sz, L };
    }

    function generateLgkAsm(compressedData, id) {
        const hdr = parseLgkHeader(compressedData);

        const { zxofs, depSize, L } = lgkDepcalc(cfg);

        // Compute arefs (palette table size in depacker)

            if ((arefs > 0) && (1 & cfg[13])) { // CFAREM

        const compName = (getActiveCompressors().find(x => x.id === id) || {}).name || id;

        // Build a binary depacker image (like the C code does), then emit as db with labels.
        // This replicates zxdepgen() exactly.
        const afterdep = depSize + arefs;
        const bufSize = afterdep + 16;
        const depbuf = new Uint8Array(bufSize);
        let depbufree = 0;
        let thistart = 0;

        function appendep(bytes) {

        function wpoke(ofs, word) {

            // via labels, we store word as-is (the depacker-relative offset).
            // We track wpoke calls separately for label resolution.
            depbuf[thistart + ofs] = word & 0xFF;
            depbuf[thistart + ofs + 1] = (word >> 8) & 0xFF;

        // We need to track all wpoke patches so we can emit dw labels instead of raw bytes.
        // Each patch: { absPos: absolute byte position, labelOfs: depacker offset }
        const patches = [];
        const bytePatch = []; // single-byte patches at absolute positions with comments
        function wpokeTracked(ofs, word, label) {
            const absPos = thistart + ofs;
            patches.push({ absPos: absPos, target: word, label: label });
            wpoke(ofs, 0); // placeholder
        }

        // --- Fragment 1: start ---
        if (cfg[16]) // CFASEP

        if (zxofs[L._altabl] >= 0) addLabel(zxofs[L._altabl], 'altabl');
        if (zxofs[L._altab] >= 0) addLabel(zxofs[L._altab], 'altab');
        if (zxofs[L._adrepv] >= 0) addLabel(zxofs[L._adrepv], 'adrepv');

        // Build a set of patch positions (absPos -> patch info)
        const patchMap = {};
        for (const p of patches) {
            patchMap[p.absPos] = p;
        }

        // Emit ASM header
        let asm = '';
        asm += '; ' + compName + ' depacker test for ZX Spectrum\n';
        asm += '; Unpack compressed data to screen ($4000, 6912 bytes)\n';
        asm += '; Dynamic depacker generated from LgK compressed file header\n';
        asm += '; Generated by Compression Compare\n\n';
        asm += '    device ZXSPECTRUM48\n\n';
        asm += '    org $8000\n\n';
        asm += 'start:\n';

        // Emit depacker bytes as db lines with labels
        const totalBytes = depbufree;
        let i = 0;
        while (i < totalBytes) {
            // Emit any labels at this position
            if (labels[i]) {
                asm += labels[i] + ':\n';
            }

            // Check if there's a 2-byte address patch here
            if (patchMap[i]) {
                const p = patchMap[i];
                // Emit the opcode byte before the address (call/ld instructions)
                // Actually patches are at the address bytes, so the opcode is at i-1 or already emitted.
                // Since patches track absPos = position of the low byte of the address,
                // we need to check: the previous byte might be a call (0xCD), ld de (0x11), etc.
                // The wpoke writes at thistart+ofs which is the address position.
                // So we should emit up to i as db, then emit dw for i,i+1.
                // But we need the opcode byte before. Actually in our emission, we're going
                // byte by byte. The patch is at position i (and i+1). We just emit dw.
                // But we need to handle the case where i has a label too (already emitted above).
                // Let me just emit the patch target's label name using dw.

                // Determine what sjasmplus expression to use
                let expr;
                if (p.label === 'packed_data') {
                    expr = 'packed_data';
                } else if (p.label.startsWith('altab-')) {
                    expr = 'altab-1';
                } else if (p.label === 'altab_base') {
                    expr = 'altab-' + (1 << cfg[14]);
                } else if (p.label.startsWith('_')) {
                    // Self-modifying code reference (points within depacker)
                    // Use $ + offset expression
                    const targetPos = p.target;
                    expr = 'depacker+' + targetPos;
                } else {
                    expr = p.label;
                }
                asm += '    dw ' + expr + '\n';
                i += 2;
                continue;
            }

            // Emit a line of db (up to 16 bytes, stopping at labels or patches)
            const lineStart = i;
            const lineBytes = [];
            while (i < totalBytes && lineBytes.length < 16) {
                if (i > lineStart && labels[i]) break; // label at this position
                if (patchMap[i]) break; // patch at this position
                lineBytes.push(hex(depbuf[i]));
                i++;
            }
            if (lineBytes.length > 0) {
                asm += '    db ' + lineBytes.join(',') + '\n';
            }
        }

        // Add call to depacker + border stripe loop before depacker code
        asm = asm.replace('start:\n', 'start:\n    call depacker\nloop:\n    ld a,r\n    and 7\n    out ($fe),a\n    jr loop\ndepacker:\n');

        asm += '\n';

        // Emit compressed data (header stripped)
        const dataOffset = hdr.headerBytes;
        const asmData = compressedData.subarray(dataOffset);
        asm += '; --- Compressed data (' + asmData.length + ' bytes) ---\n';
        asm += 'packed_data:\n';
        asm += formatBytes(asmData) + '\n';

        asm += '\n';
        asm += '    savesna "' + id + '_screen.sna", start\n';

        return asm;
    }

    function generateRcsAsm(data, id) {
        const info = RCS_DEPACKERS[id];
        const compName = (getActiveCompressors().find(x => x.id === id) || {}).name || id;
        let asm = '';
        asm += '; ' + compName + ' depacker test for ZX Spectrum\n';
        asm += '; Unpacks an RCS-reordered screen directly to $4000 (6912 bytes).\n';
        asm += '; The "smart" depacker auto-detects the screen and un-reorders on the fly.\n';
        asm += '; Depacker by Einar Saukas: https://github.com/einar-saukas/RCS\n';
        asm += '; Generated by Compression Compare\n';
        asm += '; @main\n';            // ZX-M8XXX: assemble this file
        asm += '; @entry start\n\n';   // ZX-M8XXX: run from start
        asm += '    device ZXSPECTRUM48\n\n';
        asm += '    org $8000\n\n';
        asm += 'start:\n';
        if (info.back) {
            asm += '    ld hl,packed_data_end-1\n';
            asm += '    ld de,$5AFF\n';
        } else {
            asm += '    ld hl,packed_data\n';
            asm += '    ld de,$4000\n';
        }
        asm += '    call ' + info.label + '\n';
        asm += 'loop:\n    ld a,r\n    and 7\n    out ($fe),a\n    jr loop\n\n';
        asm += '; --- Depacker routine ---\n';
        asm += info.src + '\n';
        asm += '; --- Compressed data (' + data.length + ' bytes) ---\n';
        asm += 'packed_data:\n';
        asm += formatBytes(data) + '\n';
        if (info.back) asm += 'packed_data_end:\n';
        asm += '\n    savesna "' + id + '_screen.sna", start\n';
        return asm;
    }

    asmInfo.rcszx0  = { generator: generateRcsAsm };
    asmInfo.rcszx0b = { generator: generateRcsAsm };
    asmInfo.rcszx7  = { generator: generateRcsAsm };
    asmInfo.rcszx7b = { generator: generateRcsAsm };

    // ASC is self-extracting: the 194-byte depacker stub is emitted inline, with the
    // token stream placed immediately after it (the stub locates its data at stub+194).
    function generateAscAsm(data, id) {
        const compName = (getActiveCompressors().find(x => x.id === id) || {}).name || id;
        let asm = '';
        asm += '; ' + compName + ' (ASC v2.9) self-extracting screen depacker for ZX Spectrum\n';
        asm += '; ASC packs a 6912-byte screen into a self-extracting block:\n';
        asm += ';   [194-byte depacker stub][LZSS+RLE token stream]\n';
        asm += '; The stub is position-independent: it self-locates (call $0052 / pop), then\n';
        asm += '; decodes the token stream that immediately follows it, painting the screen\n';
        asm += '; to $4000 in 8x8-cell order. Just call it; no input registers are needed.\n';
        asm += '; Original ASC v2.9 by Andrew Strikes Code (Andrey Sendetsky), 1997.\n';
        asm += '; Generated by Compression Compare\n';
        asm += '; @main\n';            // ZX-M8XXX: assemble this file
        asm += '; @entry start\n\n';   // ZX-M8XXX: run from start
        asm += '    device ZXSPECTRUM48\n\n';
        asm += '    org $8000\n\n';
        asm += 'start:\n';
        asm += '    call asc_block       ; self-extract the screen to $4000\n';
        asm += 'loop:\n    ld a,r\n    and 7\n    out ($fe),a\n    jr loop\n\n';
        asm += '; --- ASC self-extracting depacker stub (194 bytes) ---\n';
        asm += '; The token stream MUST follow immediately (the stub reads it at asc_block+194).\n';
        asm += 'asc_block:\n';
        asm += formatBytes(ASC.STUB) + '\n';
        asm += '; --- Compressed token stream (' + data.length + ' bytes) ---\n';
        asm += 'packed_data:\n';
        asm += formatBytes(data) + '\n';
        asm += '\n    savesna "' + id + '_screen.sna", start\n';
        return asm;
    }

    asmInfo.asc = { generator: generateAscAsm };

    // ---- ASM download helpers ----
    function formatBytes(data) {
        const lines = [];
        for (let i = 0; i < data.length; i += 16) {
            const chunk = [];
            for (let j = i; j < Math.min(i + 16, data.length); j++) {
                chunk.push('$' + data[j].toString(16).toUpperCase().padStart(2, '0'));
            }
            lines.push('    db ' + chunk.join(','));
        }
        return lines.join('\n');
    }

    // Build the depacker-test .asm string for compressor `id` over the given
    // compressed bytes. Factored out of downloadAsm so it can be reused headlessly
    // (see tests/depacker-roundtrip.html). Returns null if `id` has no depacker.
    function buildAsmString(id, compressedData) {
        const info = asmInfo[id];
        if (!info || !compressedData) return null;

        if (info.generator) {
            return info.generator(compressedData, id);
        }

        const isBackward = id === 'zx7b' || id === 'zx0b' || id === 'exob';
        const compName = (getActiveCompressors().find(x => x.id === id) || {}).name || id;

        let asm = '';
        asm += '; ' + compName + ' depacker test for ZX Spectrum\n';
        asm += '; Unpack compressed data to screen ($4000, 6912 bytes)\n';
        asm += '; Depacker sources: https://github.com/uniabis/z80depacker\n';
        asm += '; Generated by Compression Compare\n\n';
        asm += '    device ZXSPECTRUM48\n\n';
        asm += '    org $8000\n\n';
        asm += 'start:\n';
        asm += info.setup;
        asm += '\n';
        asm += '; --- Depacker routine ---\n';
        asm += info.depacker;
        asm += '\n';
        const dataOff = info.dataOffset || 0;
        const asmData = dataOff ? compressedData.subarray(dataOff) : compressedData;
        asm += '; --- Compressed data (' + asmData.length + ' bytes) ---\n';
        asm += 'packed_data:\n';
        asm += formatBytes(asmData) + '\n';
        if (isBackward) {
            asm += 'packed_data_end:\n';
        }
        asm += '\n';
        asm += '    savesna "' + id + '_screen.sna", start\n';
        return asm;
    }

    // Test hook: pack `screenData` with compressor `id`, returning the compressed
    // bytes and its depacker .asm. Used by the headless depacker-roundtrip harness.
    window.__packAndAsm = function(id, screenData, level) {
        const c = getActiveCompressors().find(x => x.id === id);
        if (!c || !c.compress) return { error: 'no compressor ' + id };
        // Coerce into THIS realm's Uint8Array (caller may be a different window/iframe,
        // where `screenData instanceof Uint8Array` is false and strict packers reject it).
        const data = new Uint8Array(screenData);
        let compressed;
        try { compressed = new Uint8Array(c.compress(data, level)); }
        catch (e) { return { error: 'compress: ' + (e && e.message || e) }; }
        return { compressed: compressed, asm: buildAsmString(id, compressed),
                 attrsModified: !!c.attrsModified };
    };
    window.__asmInfoKeys = function() { return Object.keys(asmInfo); };

    function downloadAsm(id) {
        const r = results.find(x => x.id === id);
        if (!r || !r.compressedData) return;
        const asm = buildAsmString(id, r.compressedData);
        if (!asm) return;

        const blob = new Blob([asm], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = id + '_screen.asm';
        a.click();
        URL.revokeObjectURL(url);
    }

    // ---- Sorting ----
    document.querySelector('thead').addEventListener('click', function(e) {
        const th = e.target.closest('th');
        if (!th) return;
        const col = th.dataset.col;
        if (!col) return;
        if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
        document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted-asc', 'sorted-desc'));
        th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
        renderTable();
    });

    renderTable();
    </script>
</body>
</html>
