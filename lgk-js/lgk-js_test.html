<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LgK-JS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
        .box { border: 1px solid #ccc; padding: 1rem; margin: 1rem 0; border-radius: 4px; }
        button { padding: 0.5rem 1rem; cursor: pointer; margin-right: 0.5rem; }
        .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.5rem 0; }
        .controls button, .controls input, .controls select { flex-shrink: 0; }
        #result { display: none; margin-top: 1rem; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>LgK-JS</h1>

    <div class="box">
        <select id="mode" onchange="updateMode()">
            <option value="compress">Compress Screen (.scr)</option>
            <option value="decompress">Decompress</option>
            <option value="batchCompress">Batch Compress Screens</option>
            <option value="batchDecompress">Batch Decompress</option>
        </select><br>
        <div class="controls">
            <button id="selectBtn" onclick="document.getElementById('fileInput').click()">Select Files</button>
            <input type="file" id="fileInput" style="display:none">
            <span id="fileCount" style="flex:1"></span>
        </div>
        <div class="controls" id="screenOpts">
            <label>Rows:
                <input type="number" id="rows" value="24" min="1" max="24" style="width:50px">
            </label>
            <label>Start:
                <input type="number" id="start" value="0" min="0" max="23" style="width:50px">
            </label>
            <label><input type="checkbox" id="mixed"> Mixed attrs</label>
            <label id="optAttrLabel"><input type="checkbox" id="optAttr"> Optimize attrs</label>
            <label id="monoLabel" style="display:none"><input type="checkbox" id="mono"> Mono output</label>
        </div>
        <div class="controls">
            <button onclick="process()">Go</button>
        </div>
    </div>

    <div id="result">
        <p id="status"></p>
        <p>Original: <span id="origSize">-</span> &rarr; Result: <span id="resultSize">-</span> (<span id="ratio">-</span>%)</p>
        <p id="progress"></p>
        <button onclick="download()">Download</button>
    </div>

    <script src="lgk-js.js"></script>
    <script>
        let lastResult = null;
        let lastFilename = 'result.bin';
        let batchZip = null;
        let batchStartTime = 0;

        const modeSelect = document.getElementById('mode');
        const selectBtn = document.getElementById('selectBtn');
        const fileInput = document.getElementById('fileInput');
        const fileCount = document.getElementById('fileCount');
        const screenOpts = document.getElementById('screenOpts');
        const monoLabel = document.getElementById('monoLabel');
        const optAttrLabel = document.getElementById('optAttrLabel');

        function getLgkOpts() {
            return {
                rows: parseInt(document.getElementById('rows').value) || 24,
                start: parseInt(document.getElementById('start').value) || 0,
                mixed: document.getElementById('mixed').checked,
                optimizeAttrs: document.getElementById('optAttr').checked,
                mono: document.getElementById('mono').checked
            };
        }

        function updateMode() {
            const mode = modeSelect.value;
            if (mode.startsWith('batch')) {
                selectBtn.textContent = 'Select Folder';
                fileInput.webkitdirectory = true;
                fileInput.removeAttribute('multiple');
            } else {
                selectBtn.textContent = 'Select Files';
                fileInput.removeAttribute('webkitdirectory');
                fileInput.multiple = true;
            }
            const isDecompress = mode.includes('ecompress');
            monoLabel.style.display = isDecompress ? '' : 'none';
            optAttrLabel.style.display = isDecompress ? 'none' : '';
            fileInput.value = '';
            fileCount.textContent = '';
        }

        fileInput.addEventListener('change', function() {
            if (this.files.length === 1) {
                fileCount.textContent = this.files[0].name;
            } else if (this.files.length > 1) {
                const firstFile = this.files[0];
                const path = firstFile.webkitRelativePath || '';
                const dirName = path.split('/')[0] || 'directory';
                fileCount.textContent = dirName + ' (' + this.files.length + ' files)';
            } else {
                fileCount.textContent = '';
            }
        });

        async function readFile(file) {
            return new Uint8Array(await file.arrayBuffer());
        }

        async function process() {
            batchZip = null;
            lastResult = null;
            const mode = modeSelect.value;
            const files = fileInput.files;

            if (!files.length) return alert('Select file(s)');

            try {
                if (mode === 'compress') {
                    const data = await readFile(files[0]);
                    const opts = getLgkOpts();
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('status').textContent = 'Compressing...';
                    document.getElementById('status').className = '';
                    setTimeout(function() {
                        try {
                            const result = LgK.compress(data, opts);
                            lastResult = result;
                            lastFilename = files[0].name + '.lgk';
                            showResult(data.length, result.length);
                        } catch (e) {
                            showError(e.message);
                        }
                    }, 10);
                    return;
                } else if (mode === 'decompress') {
                    const data = await readFile(files[0]);
                    const opts = getLgkOpts();
                    const result = LgK.decompress(data, opts);
                    lastResult = result;
                    lastFilename = files[0].name.replace(/\.lgk$/, '');
                    if (lastFilename === files[0].name) lastFilename += '.scr';
                    showResult(data.length, result.length);
                } else if (mode === 'batchCompress') {
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('status').textContent = 'Processing...';
                    document.getElementById('status').className = '';
                    const zip = new JSZip();
                    batchStartTime = Date.now();
                    processBatchCompress(files, zip, 0, []);
                    return;
                } else if (mode === 'batchDecompress') {
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('status').textContent = 'Processing...';
                    document.getElementById('status').className = '';
                    const zip = new JSZip();
                    batchStartTime = Date.now();
                    processBatchDecompress(files, zip, 0);
                    return;
                }
            } catch (e) {
                showError(e.message);
            }
        }

        function processBatchCompress(files, zip, index, results) {
            if (index >= files.length) {
                batchZip = zip;
                showBatch(files.length, results);
                return;
            }
            document.getElementById('progress').textContent = `Processing: (${index+1}/${files.length}) ${files[index].name}`;
            readFile(files[index]).then(data => {
                try {
                    const opts = getLgkOpts();
                    const result = LgK.compress(data, opts);
                    const name = files[index].name + '.lgk';
                    zip.file(name, result);
                    results.push({ name: files[index].name, origSize: data.length, resultSize: result.length });
                } catch (e) {
                    results.push({ name: files[index].name, origSize: data.length, resultSize: -1, error: e.message });
                }
                setTimeout(() => processBatchCompress(files, zip, index + 1, results), 0);
            });
        }

        function processBatchDecompress(files, zip, index) {
            if (index >= files.length) {
                batchZip = zip;
                showBatch(files.length);
                return;
            }
            document.getElementById('progress').textContent = `Processing: (${index+1}/${files.length}) ${files[index].name}`;
            readFile(files[index]).then(data => {
                try {
                    const opts = getLgkOpts();
                    const result = LgK.decompress(data, opts);
                    const name = files[index].name.replace(/\.lgk$/, '');
                    zip.file(name === files[index].name ? name + '.scr' : name, result);
                } catch (e) {
                    // skip failed files
                }
                setTimeout(() => processBatchDecompress(files, zip, index + 1), 0);
            });
        }

        function showResult(orig, result) {
            document.getElementById('result').style.display = 'block';
            document.getElementById('status').className = 'success';
            document.getElementById('status').textContent = 'Success!';
            document.getElementById('origSize').textContent = orig;
            document.getElementById('resultSize').textContent = result;
            document.getElementById('ratio').textContent = ((result / orig) * 100).toFixed(1);
            document.getElementById('progress').textContent = '';
        }

        function showError(msg) {
            document.getElementById('result').style.display = 'block';
            document.getElementById('status').className = 'error';
            document.getElementById('status').textContent = 'Error: ' + msg;
            document.getElementById('progress').textContent = '';
        }

        function showBatch(count, results) {
            const elapsed = ((Date.now() - batchStartTime) / 1000).toFixed(1);
            document.getElementById('result').style.display = 'block';
            document.getElementById('status').className = 'success';
            document.getElementById('status').textContent = 'Done! ' + count + ' files (' + elapsed + 's)';
            document.getElementById('origSize').textContent = '-';
            document.getElementById('resultSize').textContent = '-';
            document.getElementById('ratio').textContent = '-';
            if (results && results.length > 0) {
                const ok = results.filter(r => r.resultSize > 0);
                const err = results.filter(r => r.resultSize < 0);
                let info = '';
                if (ok.length > 0) {
                    const best = ok.reduce((a, b) => (b.resultSize / b.origSize) < (a.resultSize / a.origSize) ? b : a);
                    const worst = ok.reduce((a, b) => (b.resultSize / b.origSize) > (a.resultSize / a.origSize) ? b : a);
                    info += 'Best ratio: ' + ((best.resultSize / best.origSize) * 100).toFixed(1) + '% ' + best.name + '<br>';
                    info += 'Worst ratio: ' + ((worst.resultSize / worst.origSize) * 100).toFixed(1) + '% ' + worst.name;
                }
                if (err.length > 0) {
                    info += '<br><br><span class="error">' + err.length + ' file(s) failed</span>';
                }
                document.getElementById('progress').innerHTML = info;
            } else {
                document.getElementById('progress').textContent = '';
            }
        }

        function download() {
            const a = document.createElement('a');
            if (batchZip) {
                batchZip.generateAsync({ type: 'blob' }).then(blob => {
                    a.href = URL.createObjectURL(blob);
                    a.download = 'lgk_results.zip';
                    a.click();
                });
            } else if (lastResult) {
                a.href = URL.createObjectURL(new Blob([lastResult]));
                a.download = lastFilename;
                a.click();
            }
        }

        updateMode();
    </script>
</body>
</html>
